<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Wiring: Blue Star AC Wi-Fi header to ESP32 DevKit V1</title>
  <rect width="880" height="500" rx="14" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b1b">Blue Star AC (IC318QNU) → ESP32 DevKit V1 Connection</text>

  <!-- AC Header Box -->
  <rect x="40" y="70" width="220" height="380" rx="10" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-weight="700" font-size="16" fill="#1f5fa8">AC Display Board</text>
  <text x="150" y="125" text-anchor="middle" font-size="13" fill="#1f5fa8">4-Pin JST-XH (CN2)</text>
  
  <!-- AC Pins -->
  <g font-weight="600" fill="#1b1b1b">
    <rect x="160" y="150" width="100" height="40" rx="6" fill="#ffffff" stroke="#1f5fa8"/>
    <text x="210" y="175" text-anchor="middle">R_WIFI</text>
    
    <rect x="160" y="240" width="100" height="40" rx="6" fill="#ffffff" stroke="#1f5fa8"/>
    <text x="210" y="265" text-anchor="middle">T_WIFI</text>
    
    <rect x="160" y="320" width="100" height="40" rx="6" fill="#ffffff" stroke="#1f5fa8"/>
    <text x="210" y="345" text-anchor="middle">GND</text>
    
    <rect x="160" y="390" width="100" height="40" rx="6" fill="#ffffff" stroke="#1f5fa8"/>
    <text x="210" y="415" text-anchor="middle">5V</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="60" y="175">AC TX (5V)</text>
    <text x="60" y="265">AC RX (3.3V)</text>
    <text x="60" y="345">Ground</text>
    <text x="60" y="415">Supply (5V)</text>
  </g>

  <!-- ESP32 DevKit V1 Box -->
  <rect x="620" y="70" width="220" height="380" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="100" text-anchor="middle" font-weight="700" font-size="16" fill="#2e7d32">ESP32 DevKit V1</text>
  <text x="730" y="125" text-anchor="middle" font-size="13" fill="#2e7d32">(30 or 36 pin board)</text>
  
  <!-- ESP Pins -->
  <g font-weight="600" fill="#1b1b1b">
    <rect x="620" y="150" width="110" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="675" y="175" text-anchor="middle">GPIO 16 (RX2)</text>
    
    <rect x="620" y="240" width="110" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="675" y="265" text-anchor="middle">GPIO 17 (TX2)</text>
    
    <rect x="620" y="320" width="110" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="675" y="345" text-anchor="middle">GND</text>
    
    <rect x="620" y="390" width="110" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="675" y="415" text-anchor="middle">VIN (or 5V)</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="745" y="175">UART2 RX</text>
    <text x="745" y="265">UART2 TX</text>
    <text x="745" y="345">Ground</text>
    <text x="745" y="415">Power In</text>
  </g>

  <!-- Wiring Lines -->

  <!-- R_WIFI -> Divider -> GPIO 16 -->
  <g stroke="#1b1b1b" stroke-width="2.5" fill="none">
    <line x1="260" y1="170" x2="330" y2="170"/>
    <!-- 5k resistor -->
    <rect x="330" y="158" width="70" height="24" rx="4" fill="#fff7e0" stroke="#b26a00" stroke-width="2"/>
    <line x1="400" y1="170" x2="620" y2="170"/>
    
    <!-- Tap point to GND -->
    <circle cx="490" cy="170" r="4" fill="#1b1b1b"/>
    <line x1="490" y1="170" x2="490" y2="210"/>
    <!-- 10k resistor -->
    <rect x="478" y="210" width="24" height="60" rx="4" fill="#fff7e0" stroke="#b26a00" stroke-width="2"/>
    <line x1="490" y1="270" x2="490" y2="340"/>
    <circle cx="490" cy="340" r="4" fill="#1b1b1b"/>
  </g>
  <text x="365" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#b26a00">5 kΩ</text>
  <text x="365" y="148" text-anchor="middle" font-size="11" fill="#777">(2 × 10kΩ in ∥)</text>
  <text x="515" y="245" font-size="12" font-weight="700" fill="#b26a00">10 kΩ</text>
  <text x="560" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">≈ 3.3V</text>

  <!-- T_WIFI -> GPIO 17 -->
  <g stroke="#1b1b1b" stroke-width="2.5" fill="none">
    <line x1="260" y1="260" x2="620" y2="260"/>
  </g>
  <text x="440" y="252" text-anchor="middle" font-size="12" fill="#555">Direct Connection (3.3V logic accepted)</text>

  <!-- GND Line -->
  <g stroke="#1b1b1b" stroke-width="2.5" fill="none">
    <line x1="260" y1="340" x2="620" y2="340"/>
  </g>

  <!-- 5V Supply Line -->
  <g stroke="#c62828" stroke-width="2.5" fill="none">
    <line x1="260" y1="410" x2="620" y2="410"/>
  </g>

  <!-- Safety Warning -->
  <text x="440" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">
    ⚠️ WARNING: Never plug in USB while the 5V line from the AC is connected!
  </text>
</svg>
